name: SQL Guard tests
on:
  pull_request:
    paths:
      - 'extensions/sql-guard/**'
      - '.github/workflows/sql-guard-tests.yml'
  push:
    paths:
      - 'extensions/sql-guard/**'
      - '.github/workflows/sql-guard-tests.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run SQL guard policy tests
        run: cd extensions/sql-guard && python -m unittest -v test_policy.py
