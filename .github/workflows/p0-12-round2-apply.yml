name: P0-12 round2 apply

on:
  push:
    branches:
      - feat/production-readiness-p0-12-supply-chain-20260902
    paths:
      - .github/workflows/p0-12-round2-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply prepared fixes
        run: python3 tools/p0-12-round2-repair.py
      - name: Validate targeted changes
        run: |
          php -l security/supply-chain/check.php
          git diff --check
          bash tests/security/SupplyChainReviewRound2RegressionTest.sh
          bash tests/security/SupplyChainHeadEvidenceRegressionTest.sh
          bash tests/security/SupplyChainPolicyTest.sh
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security/supply-chain/check.php security/supply-chain/POLICY.md tests/run.sh tests/security/SupplyChainReviewRound2RegressionTest.sh
          git diff --cached --quiet && exit 1
          git commit -m "Fix final P0-12 npm and allowlist review findings"
          git push origin HEAD:feat/production-readiness-p0-12-supply-chain-20260902
