name: Hache-Base CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: hache_base_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mbstring mariadb-client

      - name: Git whitespace check
        run: >-
          git diff --check HEAD^ -- .
          ':(exclude)seo/reference/SEO-TECHNICAL-BASE-2026.md'
          ':(exclude)docs/production-readiness/*.md'
          ':(exclude)templates/CRITICAL-USER-FLOWS.md'

      - name: Shell syntax
        run: |
          find deployment integrations tests seo -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n

      - name: Supply-chain baseline
        env:
          SUPPLY_CHAIN_MODE: baseline
          SUPPLY_CHAIN_LEVEL: A
          SUPPLY_CHAIN_DISABLE_EXTERNAL_SCA: 1
          SUPPLY_CHAIN_REPORT_FILE: ${{ runner.temp }}/hache-supply-chain-report.json
        run: php security/supply-chain/check.php

      - name: PHP and unit checks
        run: bash tests/run.sh

      - name: SEO module regression fixture
        env:
          SEO_MODE: public
          SEO_EXPECT_INDEXABLE: 1
          SEO_REQUIRE_CANONICAL: 1
        run: node seo/tests/seo-static.mjs seo/tests/fixtures/public-site

      - name: Validate reusable schemas on MariaDB
        env:
          MYSQL_PWD: root
        run: |
          mariadb -h 127.0.0.1 -uroot hache_base_test < database/modules/core.sql
          mariadb -h 127.0.0.1 -uroot hache_base_test < database/modules/recurring-operations.sql
          mariadb -h 127.0.0.1 -uroot hache_base_test < database/modules/payment-gateway-credentials.sql
          mariadb -h 127.0.0.1 -uroot hache_base_test < database/modules/async-inbox-outbox.sql
          mariadb -h 127.0.0.1 -uroot hache_base_test < database/migrations/0001_audit_events.sql

      - name: Async inbox/outbox idempotency regression
        env:
          MYSQL_PWD: root
        run: bash tests/integration/InboxOutboxMariaDbTest.sh

      - name: Historical credential immutability regression
        env:
          MYSQL_PWD: root
        run: |
          mariadb -h 127.0.0.1 -uroot hache_base_test -e \
            "INSERT INTO payment_gateway_credentials (provider, credential_ref, access_token_enc) VALUES ('CI_PROVIDER', 'ci-historical-immutable', 'ciphertext-fixture');"

          if mariadb -h 127.0.0.1 -uroot hache_base_test -e \
            "UPDATE payment_gateway_credentials SET provider = 'CI_PROVIDER_RENAMED' WHERE credential_ref = 'ci-historical-immutable';"; then
            echo 'ERROR: una versión histórica permitió cambiar provider'
            exit 1
          fi

          provider="$(mariadb -N -B -h 127.0.0.1 -uroot hache_base_test -e \
            "SELECT provider FROM payment_gateway_credentials WHERE credential_ref = 'ci-historical-immutable';")"
          test "$provider" = 'CI_PROVIDER'

      - name: Schema idempotence check
        env:
          MYSQL_PWD: root
        run: |
          mariadb -h 127.0.0.1 -uroot hache_base_test < database/modules/core.sql
          mariadb -h 127.0.0.1 -uroot hache_base_test < database/modules/recurring-operations.sql
          mariadb -h 127.0.0.1 -uroot hache_base_test < database/modules/payment-gateway-credentials.sql
          mariadb -h 127.0.0.1 -uroot hache_base_test < database/modules/async-inbox-outbox.sql
          mariadb -h 127.0.0.1 -uroot hache_base_test < database/migrations/0001_audit_events.sql
