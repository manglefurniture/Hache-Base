name: P0-12 final repair

on:
  push:
    branches:
      - feat/production-readiness-p0-12-supply-chain-20260902
    paths:
      - .github/workflows/p0-12-final-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-readiness-p0-12-supply-chain-20260902
          fetch-depth: 2
      - name: Apply repair
        run: |
          python3 .github/p0-12-final-fix.py
          chmod +x tests/security/SupplyChainReviewRound4RegressionTest.sh
      - name: Targeted regression
        run: bash tests/security/SupplyChainReviewRound4RegressionTest.sh
      - name: Full suite
        run: bash tests/run.sh
      - name: Whitespace
        run: git diff --check
      - name: Commit tested repair
        run: |
          rm .github/workflows/p0-12-final-fix.yml .github/p0-12-final-fix.py
          git config user.name manglefurniture
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "fix: close final P0-12 review gaps"
          git push origin HEAD:feat/production-readiness-p0-12-supply-chain-20260902
