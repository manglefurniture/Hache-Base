name: P0-12 Final Five Repair

on:
  push:
    branches:
      - feat/production-readiness-p0-12-supply-chain-20260902
    paths:
      - .github/workflows/p0-12-final5-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-readiness-p0-12-supply-chain-20260902
          fetch-depth: 0

      - name: Install PHP
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mbstring

      - name: Apply repairs
        run: python3 tools/p0-12-final5-repair.py

      - name: Directed regression
        run: |
          php -l security/supply-chain/check.php
          bash -n tests/security/SupplyChainReviewRound3RegressionTest.sh
          bash tests/security/SupplyChainReviewRound3RegressionTest.sh

      - name: Full regression suite
        run: bash tests/run.sh

      - name: Whitespace check
        run: git diff --check

      - name: Commit repairs
        run: |
          git config user.name "Hache Interactive"
          git config user.email "manglefurniture@gmail.com"
          git add security/supply-chain/check.php tests/run.sh tests/security/SupplyChainReviewRound3RegressionTest.sh
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 1
          fi
          git commit -m "Fix final P0-12 supply-chain review findings"
          git push origin HEAD:feat/production-readiness-p0-12-supply-chain-20260902
