name: P0-12 repair v2

on:
  push:
    branches:
      - feat/production-readiness-p0-12-supply-chain-20260902

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Run P0-12 repair v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-readiness-p0-12-supply-chain-20260902
          fetch-depth: 0
      - name: Apply reviewed P1 repairs
        run: python3 tools/p0-12-repair-runner.py
      - name: Validate PHP and complete regression suite
        run: |
          php -l security/supply-chain/check.php
          bash tests/run.sh
      - name: Commit repaired implementation
        run: |
          git config user.name 'manglefurniture'
          git config user.email 'fixture@example.test'
          git add security/supply-chain/check.php security/supply-chain/POLICY.md tests/run.sh tests/security/SupplyChainPolicyTest.sh tests/security/SupplyChainReviewRegressionTest.sh tests/security/SupplyChainEvidenceScopeRegressionTest.sh tests/security/SupplyChainFinalReviewRegressionTest.sh tests/security/SupplyChainHeadEvidenceRegressionTest.sh
          git commit -m 'Harden P0-12 evidence against reviewed HEAD'
          git push origin HEAD:feat/production-readiness-p0-12-supply-chain-20260902
