name: P0-12 final two P1 repair

on:
  push:
    branches:
      - feat/production-readiness-p0-12-supply-chain-20260902
    paths:
      - .github/workflows/p0-12-final-two-p1-apply.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/production-readiness-p0-12-supply-chain-20260902
          fetch-depth: 2

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mbstring

      - name: Apply focused P1 fixes and regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          check = Path('security/supply-chain/check.php')
          text = check.read_text()

          old_workspace = '''            $workspaceData = $lock['packages'][$workspacePath] ?? null;
            if (!is_array($workspaceData)
                || !isset($workspaceData['name'], $workspaceData['version'])
                || !is_string($workspaceData['name']) || trim($workspaceData['name']) === ''
                || !is_string($workspaceData['version']) || trim($workspaceData['version']) === '') {
                return false;
            }
            $manifestName = $workspaceManifest['name'] ?? null;
            if (!is_string($manifestName) || trim($manifestName) === '' || trim($manifestName) !== trim($workspaceData['name'])) {
                return false;
            }
            if (array_key_exists('version', $workspaceManifest)) {
                if (!is_string($workspaceManifest['version']) || trim($workspaceManifest['version']) === ''
                    || trim($workspaceManifest['version']) !== trim($workspaceData['version'])) {
                    return false;
                }
            }
'''
          new_workspace = '''            $workspaceData = $lock['packages'][$workspacePath] ?? null;
            if (!is_array($workspaceData)) {
                return false;
            }
            $manifestName = $workspaceManifest['name'] ?? null;
            if (!is_string($manifestName) || trim($manifestName) === '') {
                return false;
            }
            $manifestName = trim($manifestName);
            if (array_key_exists('name', $workspaceData)) {
                if (!is_string($workspaceData['name']) || trim($workspaceData['name']) === ''
                    || trim($workspaceData['name']) !== $manifestName) {
                    return false;
                }
            }
            $manifestVersion = $workspaceManifest['version'] ?? null;
            if (array_key_exists('version', $workspaceManifest)
                && (!is_string($manifestVersion) || trim($manifestVersion) === '')) {
                return false;
            }
            if (array_key_exists('version', $workspaceData)) {
                if (!is_string($workspaceData['version']) || trim($workspaceData['version']) === '') {
                    return false;
                }
                if (is_string($manifestVersion) && trim($manifestVersion) !== ''
                    && trim($workspaceData['version']) !== trim($manifestVersion)) {
                    return false;
                }
            }
'''
          if old_workspace not in text:
              raise SystemExit('workspace target not found')
          text = text.replace(old_workspace, new_workspace, 1)

          old_workspace_name = "            $workspaceName = trim($workspaceData['name']);\n"
          new_workspace_name = "            $workspaceName = $manifestName;\n"
          if old_workspace_name not in text:
              raise SystemExit('workspace name target not found')
          text = text.replace(old_workspace_name, new_workspace_name, 1)

          old_composer = '''    if (array_intersect_key($prodVersions, $devVersions) !== []) {
        return false;
    }

    $allVersions = $prodVersions + $devVersions;
'''
          new_composer = '''    if (array_intersect_key($prodVersions, $devVersions) !== []) {
        return false;
    }

    $rootVersion = null;
    if (array_key_exists('version', $manifest)) {
        if (!is_string($manifest['version']) || trim($manifest['version']) === '') {
            return false;
        }
        $rootVersion = trim($manifest['version']);
    }
    foreach (['provide', 'replace'] as $relation) {
        if (isset($manifest[$relation]) && !is_array($manifest[$relation])) {
            return false;
        }
        foreach (($manifest[$relation] ?? []) as $virtual => $provided) {
            if (!is_string($virtual) || trim($virtual) === '' || !is_string($provided) || trim($provided) === '') {
                return false;
            }
            $provided = trim($provided);
            if (strcasecmp($provided, 'self.version') === 0) {
                if ($rootVersion === null) {
                    return false;
                }
                $provided = $rootVersion;
            }
            $prodProviders[trim($virtual)][] = $provided;
        }
    }

    $allVersions = $prodVersions + $devVersions;
'''
          if old_composer not in text:
              raise SystemExit('composer target not found')
          text = text.replace(old_composer, new_composer, 1)
          check.write_text(text)

          test = Path('tests/security/SupplyChainReviewRound3RegressionTest.sh')
          t = test.read_text()
          marker = 'echo "SUPPLY_CHAIN_REVIEW_ROUND3_REGRESSION_OK"\n'
          if marker not in t:
              raise SystemExit('test marker not found')
          cases = r'''
workspace_npm11="$(new_repo npm11-workspace-lock-shape)"
mkdir -p "$workspace_npm11/packages/a"
printf '%s\n' '{"name":"fixture","private":true,"packageManager":"npm@11.4.2","workspaces":["packages/*"]}' > "$workspace_npm11/package.json"
printf '%s\n' '{"name":"a","version":"1.0.0"}' > "$workspace_npm11/packages/a/package.json"
cat > "$workspace_npm11/package-lock.json" <<'JSON'
{"name":"fixture","lockfileVersion":3,"packages":{"":{"name":"fixture","version":"1.0.0"},"node_modules/a":{"resolved":"packages/a","link":true},"packages/a":{"version":"1.0.0"}}}
JSON
commit_all "$workspace_npm11"
raw_check "$workspace_npm11" SUPPLY_CHAIN_MODE=baseline SUPPLY_CHAIN_LEVEL=A > "$workspace_npm11/out.txt"
! grep -q 'rule=node_lock_invalid_format' "$workspace_npm11/out.txt"

workspace_private="$(new_repo npm11-private-workspace-lock-shape)"
mkdir -p "$workspace_private/packages/a"
printf '%s\n' '{"name":"fixture","private":true,"packageManager":"npm@11.4.2","workspaces":["packages/*"]}' > "$workspace_private/package.json"
printf '%s\n' '{"name":"a","private":true}' > "$workspace_private/packages/a/package.json"
cat > "$workspace_private/package-lock.json" <<'JSON'
{"name":"fixture","lockfileVersion":3,"packages":{"":{"name":"fixture","version":"1.0.0"},"node_modules/a":{"resolved":"packages/a","link":true},"packages/a":{}}}
JSON
commit_all "$workspace_private"
raw_check "$workspace_private" SUPPLY_CHAIN_MODE=baseline SUPPLY_CHAIN_LEVEL=A > "$workspace_private/out.txt"
! grep -q 'rule=node_lock_invalid_format' "$workspace_private/out.txt"

composer_root_replace="$(new_repo composer-root-replace-self-version)"
printf '%s\n' '{"name":"fixture/app","version":"1.2.3","replace":{"vendor/virtual":"self.version"},"require":{"vendor/a":"^1.0"}}' > "$composer_root_replace/composer.json"
cat > "$composer_root_replace/composer.lock" <<'JSON'
{"packages":[{"name":"vendor/a","version":"1.0.0","require":{"vendor/virtual":"^1.0"}}],"packages-dev":[]}
JSON
commit_all "$composer_root_replace"
raw_check "$composer_root_replace" SUPPLY_CHAIN_MODE=baseline SUPPLY_CHAIN_LEVEL=A > "$composer_root_replace/out.txt"
! grep -q 'rule=composer_lock_invalid_format' "$composer_root_replace/out.txt"

'''
          t = t.replace(marker, cases + marker, 1)
          test.write_text(t)
          PY

      - name: Targeted regression
        run: bash tests/security/SupplyChainReviewRound3RegressionTest.sh

      - name: Full test suite
        run: bash tests/run.sh

      - name: Whitespace check
        run: git diff --check

      - name: Commit validated repair
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add security/supply-chain/check.php tests/security/SupplyChainReviewRound3RegressionTest.sh
          git diff --cached --quiet && exit 0
          git commit -m "fix: accept real workspace locks and root Composer providers"
          git push origin HEAD:feat/production-readiness-p0-12-supply-chain-20260902
