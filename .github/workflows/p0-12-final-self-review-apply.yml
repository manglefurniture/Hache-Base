name: P0-12 final self-review apply

on:
  push:
    branches:
      - feat/production-readiness-p0-12-supply-chain-20260902
    paths:
      - .github/workflows/p0-12-final-self-review-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final self-review hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          check = Path('security/supply-chain/check.php')
          s = check.read_text()

          old_root = r'''function withinRoot(string $root, string $relative): string
          {
              if ($relative === '' || $relative === '.') {
                  return $root;
              }
              if (str_starts_with($relative, '/') || preg_match('~^[A-Za-z]:[\\/]~', $relative)) {
                  configError("stack_root_must_be_relative value={$relative}");
              }
              $candidate = realpath($root . DIRECTORY_SEPARATOR . $relative);
              if ($candidate === false || ($candidate !== $root && !str_starts_with($candidate, $root . DIRECTORY_SEPARATOR))) {
                  configError("invalid_stack_root value={$relative}");
              }
              return $candidate;
          }

          function stackFileRelative(string $stackRelative, string $file): string
          {
              if ($stackRelative === '' || $stackRelative === '.') {
                  return $file;
              }
              return trim($stackRelative, '/') . '/' . $file;
          }
          '''
          new_root = r'''function normalizeStackRoot(string $relative): string
          {
              $value = trim(str_replace('\\', '/', $relative));
              if ($value === '' || $value === '.') {
                  return '.';
              }
              if (str_starts_with($value, '/') || preg_match('~^[A-Za-z]:/~', $value)) {
                  configError("stack_root_must_be_relative value={$relative}");
              }
              $segments = explode('/', $value);
              $normalized = [];
              foreach ($segments as $segment) {
                  if ($segment === '' || $segment === '.') {
                      continue;
                  }
                  if ($segment === '..') {
                      configError("stack_root_must_not_traverse value={$relative}");
                  }
                  $normalized[] = $segment;
              }
              return $normalized === [] ? '.' : implode('/', $normalized);
          }

          function withinRoot(string $root, string $relative): string
          {
              $normalized = normalizeStackRoot($relative);
              return $normalized === '.'
                  ? $root
                  : $root . DIRECTORY_SEPARATOR . str_replace('/', DIRECTORY_SEPARATOR, $normalized);
          }

          function stackFileRelative(string $stackRelative, string $file): string
          {
              $normalized = normalizeStackRoot($stackRelative);
              return $normalized === '.' ? $file : $normalized . '/' . $file;
          }
          '''
          if s.count(old_root) != 1:
              raise SystemExit(f'root helper block expected once, got {s.count(old_root)}')
          s = s.replace(old_root, new_root, 1)

          old_regex = "if (preg_match('/^(\\d+)(?:\\.(\\d+))?(?:\\.(\\d+))?/', $value, $matches) !== 1) {"
          new_regex = "if (preg_match('/^(\\d+)(?:\\.(\\d+))?(?:\\.(\\d+))?$/', $value, $matches) !== 1) {"
          if s.count(old_regex) != 1:
              raise SystemExit(f'composer numeric regex expected once, got {s.count(old_regex)}')
          s = s.replace(old_regex, new_regex, 1)

          old_roots = '''$stackRootsRaw = trim((string)envValue('SUPPLY_CHAIN_STACK_ROOTS', '.'));
          $stackRoots = array_values(array_unique(array_filter(array_map('trim', explode(',', $stackRootsRaw)), static fn(string $value): bool => $value !== '')));
          if ($stackRoots === []) {
              $stackRoots = ['.'];
          }
          '''
          new_roots = '''$stackRootsRaw = trim((string)envValue('SUPPLY_CHAIN_STACK_ROOTS', '.'));
          $rawStackRoots = array_values(array_filter(array_map('trim', explode(',', $stackRootsRaw)), static fn(string $value): bool => $value !== ''));
          if ($rawStackRoots === []) {
              $rawStackRoots = ['.'];
          }
          $normalizedStackRoots = [];
          foreach ($rawStackRoots as $stackRoot) {
              $normalizedStackRoots[normalizeStackRoot($stackRoot)] = true;
          }
          $stackRoots = array_keys($normalizedStackRoots);
          '''
          if s.count(old_roots) != 1:
              raise SystemExit(f'stack root init expected once, got {s.count(old_roots)}')
          s = s.replace(old_roots, new_roots, 1)
          check.write_text(s)

          test = Path('tests/security/SupplyChainHeadEvidenceRegressionTest.sh')
          t = test.read_text()
          marker = '\necho "SUPPLY_CHAIN_HEAD_EVIDENCE_REGRESSION_OK"\n'
          if t.count(marker) != 1:
              raise SystemExit(f'head evidence marker expected once, got {t.count(marker)}')
          addition = r'''

          # A declared stack is evidence from HEAD, not from whether its directory still exists in a dirty working tree.
          head_stack="$(new_repo normalized-head-stack)"
          mkdir -p "$head_stack/frontend"
          printf '%s\n' '{"name":"frontend","private":true,"packageManager":"npm@11.0.0","dependencies":{"pkg":"^1.0.0"}}' > "$head_stack/frontend/package.json"
          cat > "$head_stack/frontend/package-lock.json" <<'JSON'
          {"name":"frontend","lockfileVersion":3,"packages":{"":{"name":"frontend","version":"1.0.0","dependencies":{"pkg":"^1.0.0"}},"node_modules/pkg":{"name":"pkg","version":"1.2.0","license":"MIT"}}}
          JSON
          commit_all "$head_stack"
          rm -rf "$head_stack/frontend"
          raw_check "$head_stack" SUPPLY_CHAIN_DISABLE_EXTERNAL_SCA=1 SUPPLY_CHAIN_MODE=baseline SUPPLY_CHAIN_LEVEL=A SUPPLY_CHAIN_STACK_ROOTS='./frontend' > "$head_stack/out.txt"
          ! grep -q 'category=lockfile' "$head_stack/out.txt"
          grep -q '"root": "frontend"' "$head_stack/report.json"

          # Composer versions that only begin with a numeric prefix are not stable numeric evidence.
          composer_unstable="$(new_repo composer-unstable-version)"
          printf '%s\n' '{"name":"fixture/app","require":{"vendor/pkg":"^1.2"}}' > "$composer_unstable/composer.json"
          printf '%s\n' '{"packages":[{"name":"vendor/pkg","version":"1.2.x-dev","license":["MIT"]}],"packages-dev":[]}' > "$composer_unstable/composer.lock"
          commit_all "$composer_unstable"
          set +e
          raw_check "$composer_unstable" SUPPLY_CHAIN_DISABLE_EXTERNAL_SCA=1 SUPPLY_CHAIN_MODE=baseline SUPPLY_CHAIN_LEVEL=A > "$composer_unstable/out.txt" 2>&1
          composer_unstable_rc=$?
          set -e
          [[ "$composer_unstable_rc" -eq 1 ]]
          grep -q 'rule=composer_lock_invalid_format' "$composer_unstable/out.txt"
          '''
          # Workflow YAML indentation is stripped by the shell heredoc; normalize the inserted script text.
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines())
          t = t.replace(marker, addition + marker, 1)
          test.write_text(t)
          PY

      - name: Validate focused regressions
        run: |
          php -l security/supply-chain/check.php
          bash -n tests/security/SupplyChainHeadEvidenceRegressionTest.sh
          bash tests/security/SupplyChainHeadEvidenceRegressionTest.sh
          bash tests/security/SupplyChainReviewRound2RegressionTest.sh
          git diff --check

      - name: Commit validated final self-review hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security/supply-chain/check.php tests/security/SupplyChainHeadEvidenceRegressionTest.sh
          git diff --cached --quiet && exit 1
          git commit -m "Harden supply-chain stack HEAD scope and Composer version parsing"
          git push origin HEAD:feat/production-readiness-p0-12-supply-chain-20260902
