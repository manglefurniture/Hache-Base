name: P0-12 repair workflow fix

on:
  push:
    branches:
      - feat/production-readiness-p0-12-supply-chain-20260902

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Fix P0-12 repair workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-readiness-p0-12-supply-chain-20260902
          fetch-depth: 0
      - name: Make hyphen repair structural
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/p0-12-repair.yml')
          s = p.read_text()
          old = "          replace_once(old_hyphen, new_hyphen, 'Composer abbreviated hyphen range')"
          new = '''          hyphen_anchor = "if (preg_match('/^v?(\\\\d+(?:\\\\.\\\\d+){0,2})\\\\s+-\\\\s+v?(\\\\d+(?:\\\\.\\\\d+){0,2})$/', $branch, $range) === 1) {"
          hyphen_start = s.find(hyphen_anchor)
          hyphen_next = s.find('$tokens = preg_split', hyphen_start)
          if hyphen_start < 0 or hyphen_next < 0:
              raise SystemExit('Composer abbreviated hyphen range markers not found')
          hyphen_line_start = s.rfind('\\n', 0, hyphen_start) + 1
          hyphen_next_line_start = s.rfind('\\n', 0, hyphen_next) + 1
          s = s[:hyphen_line_start] + new_hyphen + s[hyphen_next_line_start:]'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one old hyphen repair call, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'manglefurniture'
          git config user.email 'fixture@example.test'
          git add .github/workflows/p0-12-repair.yml
          git commit -m 'Run P0-12 repair automation'
          git push origin HEAD:feat/production-readiness-p0-12-supply-chain-20260902
