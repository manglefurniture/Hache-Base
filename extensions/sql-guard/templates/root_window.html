<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hache - Acceso temporal</title>
<link rel="stylesheet" href="/static/approval.css">
<script defer src="/static/root_window.js"></script>
</head><body><main>
<h1>Acceso administrativo temporal</h1>
<p>Estado: <strong id="status" role="status" aria-live="polite">Comprobando...</strong></p>
<p>Alcance restringido: reiniciar el operador de minería cuando el guardián financiero esté sano. No concede una consola root.</p>
<p id="expiry"></p>
<button id="enable" type="button">Activar 10 minutos con passkey</button>
<button id="disable" type="button">Desactivar con passkey</button>
<p id="message" role="status" aria-live="polite"></p>
<small>Cada cambio exige una verificación nueva con tu passkey. El acceso vence automáticamente.</small>
</main></body></html>
